<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Buscador Spotify</title>
    <link rel="stylesheet" href="style/style.css">
</head>
<body>
    <header>
        <h1>Buscador de canciones</h1>
        <form>
            <input type="text" id="entradaCancion" placeholder="Escribe el nombre de una cancion">
            <button type="submit" class="boton" id="btnBuscar" disabled>Buscar</button>
            <button type="reset" class="boton" id="btnBorrar" disabled>Borrar</button>
        </form>
    </header>
    <main>
        <div id="canciones-container"></div>
        <div id="info-artista-container">


            <div class="info-principal">
                <div class="img-info-container">
                    <img class="info-img" src="img/melocoton.jpg">
                </div>
                <h3>Oques Grasses</h3>
                <span class="pupularidad">Popularidad: 61</span>
                <span class="generos"> Generos: indie catala, musica catalana, reggae catalan, rock catalan</span>
                <span class="seguidores">Seguidores: 183.613</span>
            </div>


            <div class="lista-canciones">
                <h4>Lista de canciones</h4>
                <ol>
                    <li>SORT DE TU</li>
                    <li>La gent que estimo</li>
                    <li>TOCA</li>
                </ol>
            </div>
        </div>
    </main>
    <script type="module" src="scripts/token.js"></script>
    <script type="module" src="scripts/busqueda.js"></script>
    <script type="module" src="scripts/info_artista.js"></script>
</body>
</html>
